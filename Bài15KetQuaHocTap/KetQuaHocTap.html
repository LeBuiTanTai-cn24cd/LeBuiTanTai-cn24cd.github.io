<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Kết Quả Học Tập</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 40px 15px;
        }

        /* Định dạng tiêu đề chính của trang */
        h1 {
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            color: #000000;
            text-transform: uppercase;
            font-size: 28px;
            margin-bottom: 20px;
        }

        /* Định dạng cấu trúc Bảng theo yêu cầu đề bài */
        table {
            width: 600px;               /* Độ rộng bảng bằng 600px theo yêu cầu */
            margin: 0 auto;             /* Căn bảng nằm giữa trang màn hình */
            border-collapse: collapse;  /* Khoảng cách giữa các ô = 0, đường viền không bị đôi */
            border: 1px solid #7a0099;  /* Độ dày đường viền bằng 1, màu tím sẫm */
        }

        /* Định dạng chung cho các ô tiêu đề (th) và ô nội dung (td) */
        th, td {
            border: 1px solid #7a0099;  /* Màu đường viền bao quanh tất cả các ô */
            padding: 8px;               /* Khoảng cách đệm tạo độ thoáng cho chữ */
            font-size: 15px;
        }

        /* Định dạng riêng cho các dòng tiêu đề màu xanh lục (Green) */
        th {
            background-color: #00ff00;  /* Màu nền xanh lục rực rỡ theo mẫu */
            color: #000000;             /* Chữ màu đen */
            font-weight: bold;
            text-align: center;         /* Căn giữa chữ trong ô tiêu đề */
        }

        /* Định dạng dòng cuối tổng kết */
        .footer-row td {
            background-color: #00ff00;  /* Màu nền xanh lục cho dòng cuối */
            font-weight: bold;
            color: #000000;
        }

        /* Các lớp định dạng canh lề dữ liệu */
        .text-center {
            text-align: center;         /* Căn giữa cho năm sinh, điểm số, xếp loại */
        }
        
        .text-left {
            text-align: left;           /* Căn lề trái cho Họ và tên */
            padding-left: 12px;
        }
    </style>
</head>
<body>

    <h1>KẾT QUẢ HỌC TẬP</h1>

    <table>
        <tr>
            <th rowspan="2" style="width: 35%;">Họ Và tên<br>Học Sinh</th>
            <th colspan="2" style="width: 30%;">Năm Sinh</th>
            <th rowspan="2" style="width: 15%;">Điểm<br>TB</th>
            <th rowspan="2" style="width: 20%;">Xếp Loại</th>
        </tr>
        
        <tr>
            <th style="width: 15%;">Nam</th>
            <th style="width: 15%;">Nữ</th>
        </tr>

        <tr>
            <td class="text-left">Lê Thanh Xuân</td>
            <td class="text-center"></td>
            <td class="text-center">1950</td>
            <td class="text-center">8.5</td>
            <td class="text-center">Giỏi</td>
        </tr>
        <tr>
            <td class="text-left">Phan Thế Hạ</td>
            <td class="text-center">1985</td>
            <td class="text-center"></td>
            <td class="text-center">6.5</td>
            <td class="text-center">Khá</td>
        </tr>
        <tr>
            <td class="text-left">Trần Hoài Thu</td>
            <td class="text-center"></td>
            <td class="text-center">1986</td>
            <td class="text-center">9.5</td>
            <td class="text-center">Xuất Sắc</td>
        </tr>
        <tr>
            <td class="text-left">Trương Lưu Đông</td>
            <td class="text-center">1984</td>
            <td class="text-center"></td>
            <td class="text-center">6.0</td>
            <td class="text-center">Trung Bình</td>
        </tr>
        <tr>
            <td class="text-left">Lưu Thế Mạc</td>
            <td class="text-center">1985</td>
            <td class="text-center"></td>
            <td class="text-center">4.5</td>
            <td class="text-center">Kém</td>
        </tr>

        <tr class="footer-row">
            <td colspan="3" class="text-center">Tổng số học sinh đạt:</td>
            <td colspan="2" class="text-center">4 Học sinh</td>
        </tr>
    </table>

</body>
</html>
