<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CHƯƠNG TRÌNH ĐÀO TẠO WEB - CSS</title>
    
    <style>
        /* 1. Định dạng chung cho nền và font chữ toàn trang web */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /* Font chữ hiện đại, thanh lịch */
            background-color: #f0f2f5; /* Màu nền xám nhạt dịu mắt */
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center; /* Căn giữa khung nội dung theo chiều ngang */
        }

        /* 2. Định dạng khung chứa (Box) bọc bên ngoài nội dung bài tập */
        .wrapper-box {
            background-color: #ffffff; /* Nền trắng làm nổi bật nội dung */
            width: 100%;
            max-width: 550px;          /* Giới hạn độ rộng tối đa của khung */
            padding: 30px 40px;
            border-radius: 12px;       /* Bo tròn nhẹ các góc khung */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08); /* Tạo hiệu ứng đổ bóng mờ hiện đại */
            border-left: 5px solid #0056b3; /* Thêm một thanh màu xanh điểm nhấn bên lề trái */
        }

        /* 3. Định dạng cho Tiêu đề bài học */
        h3 {
            color: #d90429;            /* Màu đỏ đậm thay cho màu đỏ tươi nguyên bản */
            text-align: center;        /* Căn giữa tiêu đề */
            text-transform: uppercase; /* Tự động chuyển văn bản thành chữ IN HOA */
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 20px;
            letter-spacing: 0.5px;     /* Nới rộng khoảng cách giữa các chữ cái */
        }

        /* 4. Định dạng cho Danh sách có thứ tự (ol) */
        ol {
            color: #0056b3;            /* Đổi sang màu xanh dương đậm (Royal Blue) sang trọng */
            font-weight: bold;         /* Giữ nguyên yêu cầu in đậm của đề bài */
            padding-left: 20px;        /* Tạo khoảng thụt lề hợp lý cho các con số */
            margin: 0;
        }

        /* 5. Định dạng cho từng mục dòng con (li) */
        ol li {
            margin-bottom: 14px;       /* Tạo khoảng cách thông thoáng giữa các dòng */
            font-size: 16px;
            padding-left: 5px;
        }

        /* Hiệu ứng rê chuột (Hover) tương tác cho danh sách thêm sinh động */
        ol li:hover {
            color: #ef233c;            /* Khi di chuột vào dòng nào, dòng đó đổi sang màu đỏ */
            transition: color 0.2s ease; /* Tạo hiệu ứng chuyển màu mượt mà */
        }
    </style>
</head>
<body>

    <div class="wrapper-box">
    
        <h3>Chương trình đào tạo thiết kế web</h3>
        
        <ol>
            <li>Ngôn ngữ HTML & FrontPage.</li>
            <li>Xử lý ảnh & Thiết kế giao diện PhotoShopCS.</li>
            <li>DreamWeaver MX.</li>
            <li>Khai thác và Quản trị Domain, Hostting.</li>
            <li>Ngôn ngữ kịch bản JavaScript.</li>
        </ol>
        
    </div>

</body>
</html>
