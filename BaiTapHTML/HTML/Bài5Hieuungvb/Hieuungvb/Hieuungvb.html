<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài Tập 05 - Hiệu Ứng Chuyển Động Chữ</title>
    <link rel="stylesheet" href="style_hieuung.css">
</head>
<!-- Thiết lập thuộc tính màu nền và lề trên trực tiếp tại thẻ body theo chuẩn đề bài -->
<body bgcolor="#FFFFCC" topmargin="20">

    <!-- 
        Giải thích các thuộc tính trong thẻ marquee theo đúng hướng dẫn:
        - behavior="alternate": Đi đến viền trang rồi chuyển động ngược lại
        - direction="right": Hướng chạy sang bên phải (từ trái sang phải)
        - scrollamount="5": Tốc độ di chuyển của chữ (pixel/lần)
    -->
    <marquee behavior="alternate" direction="right" scrollamount="5" class="moving-text">
        Chào mừng các bạn đến với lớp chúng tôi
    </marquee>

</body>
</html>
