<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tạo Danh Sách Định Nghĩa - CSS</title>
    <style>
        /* Định dạng nền và font chữ cho toàn trang */
        body {
            font-family: Arial, sans-serif;
            background-image: url('../Images/bg.jpg'); /* Nhúng ảnh nền */
            background-size: cover;                /* Phủ kín nền màn hình */
            background-attachment: fixed;          /* Cố định nền khi cuộn */
            padding: 40px;
            line-height: 1.8;
        }

        /* Tạo một khung màu trắng mờ bao bọc nội dung để dễ đọc chữ hơn trên nền ảnh */
        .content-box {
            max-width: 650px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.9); /* Màu trắng trong suốt 90% */
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Định dạng tiêu đề chính H1 */
        h1 {
            color: #0056b3; /* Màu xanh dương đậm */
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 30px;
            font-size: 28px;
        }

        /* Định dạng tiêu đề danh sách (Mục lớn - dt) */
        dl dt {
            color: #d90429; /* Màu đỏ */
            font-weight: bold;
            font-size: 20px;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        /* Định dạng nội dung định nghĩa (Mục con - dd) */
        dl dd {
            color: #0056b3; /* Màu xanh dương */
            font-size: 16px;
            margin-left: 25px; /* Thụt lề vào trong so với mục lớn */
        }
    </style>
</head>
<body>

    <div class="content-box">
        <h1>Chương trình đào tạo</h1>
        
        <dl>
            <dt>TIN HỌC VĂN PHÒNG</dt>
            <dd>Tin học căn bản & WindowsXP</dd>
            <dd>Soạn Thảo văn bản Microsoft Word 2003</dd>
            <dd>Xử lý bảng tính Microsoft Excel 2003</dd>
            
            <dt>TIN HỌC QUẢN LÝ</dt>
            <dd>Lập trình CSDL Microsoft Access 2003</dd>
            <dd>Thiết kế trình chiếu Microsoft PowerPoint 2003</dd>
        </dl>
    </div>

</body>
</html>
