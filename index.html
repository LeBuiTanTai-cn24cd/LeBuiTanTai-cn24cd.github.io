<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Website Bài Tập HTML</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg,#74ebd5,#ACB6E5);
            min-height:100vh;
        }

        h1{
            text-align:center;
            color:white;
            padding:30px;
            font-size:40px;
            text-shadow:2px 2px 5px gray;
        }

        .menu{
            width:600px;
            margin:auto;
        }

        .box{
            background:white;
            margin:20px 0;
            padding:25px;
            border-radius:15px;
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
            text-align:center;
        }

        .box h2{
            margin-bottom:15px;
            color:#333;
        }

        a{
            display:inline-block;
            text-decoration:none;
            background:#007bff;
            color:white;
            padding:12px 30px;
            border-radius:8px;
            font-weight:bold;
            transition:0.3s;
        }

        a:hover{
            background:#0056b3;
            transform:scale(1.05);
        }
    </style>
</head>
<body>

    <h1>TRANG WEB BÀI TẬP CỦA LÊ BÙI TẤN TÀI</h1>
